<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>surfvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%2312131a'/%3E%3Crect x='1' y='0' width='1' height='1' fill='%23f98e09'/%3E%3Crect x='3' y='2' width='1' height='1' fill='%23fcffa4'/%3E%3Crect x='0' y='3' width='1' height='1' fill='%23bc3754'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script src="/static/htmx.min.js?v={{ static_version }}"></script>
  <script src="/static/html-to-image.js?v={{ static_version }}"></script>
</head>
<body hx-indicator="#busy">
  <div id="busy" class="htmx-indicator" role="progressbar" aria-label="Loading"></div>
  <header>
    <h1>surfvis</h1>
    <code class="ms" title="{{ ms }}">{{ ms }}</code>
    <button type="button" id="save-png" onclick="savePng(this)"
            title="Save the whole page, including what is scrolled out of view">Save as PNG</button>
  </header>

  <section id="selectors">
    {% include "_selectors.html" %}
  </section>

  <main>
    <section id="heatmap"
             hx-get="/heatmap?field={{ field }}&spw={{ spw }}&scan={{ scan }}&t={{ times[0] }}&f={{ freqs[0] }}&c={{ corrs[0] }}"
             hx-trigger="load">
      <p class="hint">Loading&hellip;</p>
    </section>
    <section id="waterfall">
      <p class="hint">Click a cell in the grid to plot that baseline's waterfall.</p>
    </section>
  </main>
  <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
