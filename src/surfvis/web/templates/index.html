<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>surfvis</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script src="/static/htmx.min.js?v={{ static_version }}"></script>
</head>
<body hx-indicator="#busy">
  <div id="busy" class="htmx-indicator" role="progressbar" aria-label="Loading"></div>
  <header>
    <h1>surfvis</h1>
    <code class="ms" title="{{ ms }}">{{ ms }}</code>
  </header>

  <section id="selectors">
    {% include "_selectors.html" %}
  </section>

  <main>
    <section id="heatmap"
             hx-get="/heatmap?field={{ field }}&spw={{ spw }}&scan={{ scan }}&t={{ times[0] }}&f={{ freqs[0] }}&c={{ corrs[0] }}"
             hx-trigger="load">
      <p class="hint">Loading&hellip;</p>
    </section>
    <section id="waterfall">
      <p class="hint">Click a cell in the grid to plot that baseline's waterfall.</p>
    </section>
  </main>
  <script>
    // Dim whatever a request is about to replace, so a click visibly did something.
    document.body.addEventListener("htmx:beforeRequest", (e) => e.detail.target.classList.add("loading"));
    document.body.addEventListener("htmx:afterRequest", (e) => e.detail.target.classList.remove("loading"));

    // Outline the cell whose waterfall is showing; survives a heatmap re-render.
    let selected = null;
    document.body.addEventListener("click", (e) => {
      const cell = e.target.closest(".grid i[data-pq]");
      if (cell) selected = cell.dataset.pq;
      markSelected();
    });
    document.body.addEventListener("htmx:afterSwap", markSelected);
    function markSelected() {
      document.querySelectorAll(".grid i.selected").forEach((c) => c.classList.remove("selected"));
      if (selected) document.querySelector(`.grid i[data-pq="${selected}"]`)?.classList.add("selected");
    }

    // PNGs are fetched by the browser, not htmx, so they report their own progress.
    function plotLoaded(img) { img.parentElement.classList.remove("loading"); }
    async function plotFailed(img) {
      const wrap = img.parentElement;
      wrap.classList.remove("loading");
      let detail = "Could not render this plot.";
      try {
        const body = await (await fetch(img.src)).json();
        if (body.detail) detail = body.detail;
      } catch (_) {}
      const p = document.createElement("p");
      p.className = "problems";
      p.textContent = detail;
      wrap.replaceWith(p);
    }
  </script>
</body>
</html>
